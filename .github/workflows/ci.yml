name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://gsv:gsv@localhost:5432/gsv
  BETTER_AUTH_SECRET: ci-only-secret-not-for-production
  BETTER_AUTH_URL: http://localhost:3100
  NEXT_PUBLIC_APP_URL: http://localhost:3100
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Typecheck · lint · unit · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gsv
          POSTGRES_PASSWORD: gsv
          POSTGRES_DB: gsv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gsv -d gsv"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: node --test "companion/test/**/*.test.mjs"
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
