# Local development: `docker compose up -d db` then `pnpm dev`.
# Full self-host:     `docker compose --profile app up -d --build`            (you bring the TLS proxy)
# Production:         `docker compose --profile app --profile proxy up -d --build`  (Caddy + Let's Encrypt on APP_DOMAIN)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gsv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gsv}
      POSTGRES_DB: ${POSTGRES_DB:-gsv}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gsv-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gsv} -d ${POSTGRES_DB:-gsv}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN:-}
        NEXT_PUBLIC_PADDLE_ENV: ${NEXT_PUBLIC_PADDLE_ENV:-sandbox}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Everything in .env reaches the app (SMTP_URL, PADDLE_*, AI_VISION_*, …);
    # the keys below override what must differ inside the compose network.
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gsv}:${POSTGRES_PASSWORD:-gsv}@db:5432/${POSTGRES_DB:-gsv}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-3000}:3000"

  caddy:
    profiles: ["proxy"]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env (e.g. configsync.app)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gsv-pgdata:
  caddy-data:
  caddy-config:
